# Lovoe: builds the branded debug APK and publishes it as a downloadable workflow artifact.
# Download it from the run page: Actions > "Lovoe APK" > latest run > Artifacts > lovoe-debug-apk.

name: "Lovoe APK"

on:
    push:
        branches-ignore: [ master, stable-* ]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: lovoe-apk-${{ github.ref }}
    cancel-in-progress: true

jobs:
    apk:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            -   name: set up JDK 21
                uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
                with:
                    distribution: "temurin"
                    java-version: 21
            -   uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
            -   name: Build Lovoe debug APK
                run: |
                    {
                      echo "org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=768m"
                      echo "kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC -XX:MaxMetaspaceSize=512m"
                      echo "org.gradle.workers.max=2"
                    } >> gradle.properties
                    ./gradlew assembleLovoeDebug
            -   uses: actions/upload-artifact@v4
                with:
                    name: lovoe-debug-apk
                    path: app/build/outputs/apk/lovoe/debug/*.apk
                    retention-days: 30
